<!doctype html>
<html lang="fr" data-theme="emeraude">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#087B48" />
    <meta name="description" content="Budget Ivoire — ton assistant budget personnel en FCFA : dépenses, Mobile Money, obligations et reste à vivre." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Budget Ivoire</title>
    <script>
      try { var u = JSON.parse(localStorage.getItem('budget-ivoire:ui') || '{}'); if (u.theme) document.documentElement.dataset.theme = u.theme; if (u.dark || u.theme === 'nuit') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Activez JavaScript pour utiliser Budget Ivoire.</noscript>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
