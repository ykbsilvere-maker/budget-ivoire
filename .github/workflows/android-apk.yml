# Construit automatiquement l'APK Android à chaque push sur main
# (ou manuellement : onglet Actions > "Build APK Android" > Run workflow).
# L'APK se télécharge dans Actions > le dernier run > Artifacts.
name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est déjà installé sur les machines GitHub (ANDROID_HOME).
      - name: Installer les dépendances
        run: npm install

      - name: Tests du moteur de calcul
        run: npm test

      - name: Build web
        # Les comptes utilisent par défaut le serveur Supabase défini dans src/config.tsx.
        # Variable facultative API_BASE (Settings > Secrets and variables > Actions > Variables) pour le remplacer.
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: npm run build

      - name: Créer / synchroniser le projet Android
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Version Android (nom = package.json, code = numéro de compilation)
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Icône de l'application
        run: |
          command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
          for d in mipmap-mdpi:48 mipmap-hdpi:72 mipmap-xhdpi:96 mipmap-xxhdpi:144 mipmap-xxxhdpi:192; do
            dir=${d%%:*}; size=${d##*:}
            mkdir -p android/app/src/main/res/$dir
            convert resources/icon.png -resize ${size}x${size} android/app/src/main/res/$dir/ic_launcher.png
            convert resources/icon.png -resize ${size}x${size} android/app/src/main/res/$dir/ic_launcher_round.png
            convert resources/icon.png -resize ${size}x${size} android/app/src/main/res/$dir/ic_launcher_foreground.png
          done

      - name: Compiler l'APK (debug, installable directement)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk budget-ivoire.apk

      - uses: actions/upload-artifact@v4
        with:
          name: budget-ivoire-apk
          path: budget-ivoire.apk

      # Lien de téléchargement direct, stable, utilisable depuis le téléphone :
      # https://github.com/<compte>/budget-ivoire/releases/latest/download/budget-ivoire.apk
      - name: Publier l'APK (dernière version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")-${{ github.run_number }}"
          gh release create "$TAG" budget-ivoire.apk \
            --title "Budget Ivoire $TAG" \
            --notes-file CHANGELOG.md \
            --latest
